spring.datasource.url=jdbc:mysql://localhost:3306/procurea?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
procurea.app.jwtSecret=SecretKeyToGenJWTsDefinitelyUseALongerOneInProduction1234567890
procurea.app.jwtExpirationMs=86400000
